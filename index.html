<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reglamento - Alfaro Poker Tour 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }
        .active-nav { color: #4ade80; border-bottom: 2px solid #4ade80; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- Header -->
    <header class="bg-gray-950 text-white py-8 px-4 text-center border-b border-gray-800">
        <p id="hdr-sub" class="text-green-400 text-sm font-medium tracking-widest uppercase mb-2"></p>
        <h1 id="hdr-title" class="text-3xl md:text-4xl font-bold"></h1>
        <p id="hdr-info" class="text-gray-400 mt-2 text-sm"></p>
    </header>

    <!-- Nav -->
    <nav class="sticky top-0 z-50 bg-gray-900/95 backdrop-blur border-b border-gray-700">
        <div class="max-w-3xl mx-auto px-4 overflow-x-auto">
            <div class="flex gap-4 py-3 text-sm font-medium text-gray-400 whitespace-nowrap">
                <a href="#general" class="nav-link pb-1 hover:text-green-400 transition">General</a>
                <a href="#inscripcion" class="nav-link pb-1 hover:text-green-400 transition">Inscripción</a>
                <a href="#noche" class="nav-link pb-1 hover:text-green-400 transition">Por Fecha</a>
                <a href="#premios" class="nav-link pb-1 hover:text-green-400 transition">Premios</a>
                <a href="#calendario" class="nav-link pb-1 hover:text-green-400 transition">Calendario</a>
                <a href="#master" class="nav-link pb-1 hover:text-green-400 transition">Master</a>
                <a href="#ciegas" class="nav-link pb-1 hover:text-green-400 transition">Ciegas</a>
                <a href="#mesa" class="nav-link pb-1 hover:text-green-400 transition">Mesa</a>
            </div>
        </div>
    </nav>

    <main id="content" class="max-w-3xl mx-auto px-4 py-8"></main>

    <!-- Footer -->
    <footer class="bg-gray-950 border-t border-gray-800 text-center py-6 px-4">
        <p class="text-white font-semibold" id="ftr-title"></p>
        <p class="text-gray-500 text-xs mt-1">Buena suerte en la mesa ♠</p>
    </footer>

    <script>
    // Helpers
    function highlight(text, keywords) {
        if (!keywords || !keywords.length) return text;
        keywords.forEach(kw => {
            text = text.replace(kw, `<mark class="bg-green-800/40 text-green-300 px-0.5 rounded">${kw}</mark>`);
        });
        return text;
    }

    function bullet(item) {
        let text = item.texto;
        // First apply highlights
        if (item.resaltar) text = highlight(text, item.resaltar);
        // Then apply badge-style destacar (like FOLD)
        if (item.destacar) {
            text = text.replace(item.destacar, `<span class="bg-red-600 text-white font-bold px-1.5 py-0.5 rounded text-xs uppercase tracking-wide">${item.destacar}</span>`);
        }
        return `<li class="flex gap-2"><span class="text-green-400 font-bold">•</span><span><strong class="text-white">${item.titulo}:</strong> ${text}</span></li>`;
    }

    function sectionTitle(id, text) {
        return `<section id="${id}" class="mb-10"><h2 class="text-xl font-bold text-white border-l-4 border-green-500 pl-3 mb-4">${text}</h2>`;
    }

    // Render
    fetch('reglamento.json')
        .then(r => r.json())
        .then(d => {
            // Header
            document.getElementById('hdr-sub').textContent = d.subtitulo;
            document.getElementById('hdr-title').textContent = d.titulo;
            document.getElementById('hdr-info').textContent = d.info;
            document.getElementById('ftr-title').textContent = d.titulo;

            let html = '';

            // === REGLAS GENERALES ===
            html += sectionTitle('general', 'Reglas Generales');
            html += '<ul class="space-y-3 text-gray-300 text-[15px] leading-relaxed">';
            d.reglasGenerales.forEach(r => { html += bullet(r); });
            html += '</ul>';
            // Pago
            html += `<div class="mt-5 bg-yellow-900/20 border border-yellow-600/40 rounded-lg p-4">
                <h3 class="font-bold text-yellow-400 mb-2 flex items-center gap-2"><span>💰</span> ${d.pago.titulo}</h3>`;
            d.pago.parrafos.forEach(p => {
                let pText = d.pago.resaltar ? highlight(p, d.pago.resaltar) : p;
                html += `<p class="text-gray-300 text-[15px] leading-relaxed mb-2">${pText}</p>`;
            });
            html += '</div></section>';

            // === INSCRIPCION ===
            html += sectionTitle('inscripcion', 'Inscripción');
            html += `<div class="bg-green-900/30 border border-green-700 rounded-lg p-4 mb-4">
                <p class="text-2xl font-bold text-green-400">${d.inscripcion.valorPorFecha} <span class="text-sm font-normal text-green-500">por fecha</span></p></div>`;
            html += '<ul class="space-y-3 text-gray-300 text-[15px] leading-relaxed">';
            d.inscripcion.reglas.forEach(r => { html += bullet(r); });
            html += '</ul></section>';

            // === PREMIOS POR FECHA ===
            html += sectionTitle('noche', 'Premios y Cobro por Fecha');
            html += `<p class="text-gray-400 text-[13px] mb-3">${d.premiosPorFecha.descripcion}</p>`;
            html += '<div class="space-y-2 mb-5">';
            const colors = ['bg-yellow-900/40 text-yellow-400', 'bg-gray-700 text-gray-300', 'bg-orange-900/40 text-orange-400'];
            d.premiosPorFecha.puestos.forEach((p, i) => {
                let pText = p.resaltar ? highlight(p.texto, p.resaltar) : p.texto;
                html += `<div class="flex items-center gap-3 bg-gray-800 border border-gray-700 rounded-lg p-3">
                    <span class="w-8 h-8 rounded-full ${colors[i]} flex items-center justify-center font-bold text-sm flex-shrink-0">${p.puesto}</span>
                    <p class="text-[15px] text-gray-300">${pText}</p></div>`;
            });
            html += '</div>';
            // Castigos
            html += `<div class="mt-5 bg-red-900/20 border border-red-700/40 rounded-lg p-4">
                <h3 class="font-bold text-red-400 mb-2 flex items-center gap-2"><span>🧽</span> Lavador y Ayudante (Castigo al Mamón)</h3>
                <ul class="space-y-2 text-gray-300 text-[15px] leading-relaxed">`;
            d.premiosPorFecha.castigos.forEach(c => {
                let cText = c.resaltar ? highlight(c.texto, c.resaltar) : c.texto;
                html += `<li class="flex gap-2"><span class="text-red-400 font-bold">•</span><span><strong class="text-white">${c.titulo}:</strong> ${cText}</span></li>`;
            });
            html += '</ul><p class="text-gray-500 text-xs mt-3 italic">El que primero se va de la partida, último se va de la cocina. 🎰</p></div></section>';

            // === PREMIOS TORNEO ===
            html += sectionTitle('premios', 'Distribución de Premios');
            html += '<h3 class="font-semibold text-gray-200 mb-2 text-sm uppercase tracking-wide">Desglose de cada fecha ($12.000 por jugador)</h3>';
            html += '<p class="text-gray-400 text-[13px] mb-3">Cada lunes, el monto aportado por cada jugador se distribuye de la siguiente manera:</p>';
            html += '<div class="grid grid-cols-3 gap-2 mb-5">';
            d.premiosTorneo.desglosePorFecha.forEach(item => {
                html += `<div class="bg-gray-800 border border-gray-700 rounded-lg p-3 text-center">
                    <p class="font-bold text-white">${item.monto}</p>
                    <p class="text-xs text-gray-400 mt-1">${item.concepto}</p></div>`;
            });
            html += '</div>';

            html += '<h3 class="font-semibold text-gray-200 mb-2 text-sm uppercase tracking-wide">Reparto del pozo semestral entre los 3 mejores</h3>';
            html += '<p class="text-gray-400 text-[13px] mb-3">Al finalizar cada torneo (17 fechas), el pozo acumulado del semestre se reparte así:</p>';
            html += '<div class="space-y-2 mb-5">';
            const barColors = ['bg-yellow-500', 'bg-gray-500', 'bg-orange-500'];
            const badgeColors = ['bg-yellow-900/40 text-yellow-400', 'bg-gray-700 text-gray-300', 'bg-orange-900/40 text-orange-400'];
            const textColors = ['text-gray-900', 'text-white', 'text-gray-900'];
            d.premiosTorneo.repartoSemestral.forEach((r, i) => {
                html += `<div class="flex items-center gap-3">
                    <span class="w-8 h-8 rounded-full ${badgeColors[i]} flex items-center justify-center font-bold text-sm">${r.puesto}</span>
                    <div class="flex-1 bg-gray-800 rounded h-6 overflow-hidden"><div class="h-full ${barColors[i]} rounded flex items-center pl-2 text-xs font-bold ${textColors[i]}" style="width:${r.porcentaje}%">${r.porcentaje}%</div></div></div>`;
            });
            html += '</div>';

            html += '<h3 class="font-semibold text-gray-200 mb-2 text-sm uppercase tracking-wide">🏆 Premio al Más Mamón</h3>';
            let mamonText = d.premiosTorneo.masMamonResaltar ? highlight(d.premiosTorneo.masMamon, d.premiosTorneo.masMamonResaltar) : d.premiosTorneo.masMamon;
            html += `<p class="text-gray-300 text-[15px] leading-relaxed mb-4">${mamonText}</p>`;

            html += '<h3 class="font-semibold text-gray-200 mb-2 text-sm uppercase tracking-wide">Criterios de Desempate</h3>';
            html += '<p class="text-gray-400 text-[13px] mb-2">Cuando dos o más jugadores empatan en un puesto que otorga premio, se aplican en orden:</p>';
            html += '<ol class="list-decimal list-inside text-gray-300 text-[15px] space-y-1 leading-relaxed">';
            d.premiosTorneo.desempate.forEach(c => { html += `<li>${c}</li>`; });
            html += '</ol></section>';

            // === CALENDARIO ===
            html += sectionTitle('calendario', 'Calendario 2026');
            html += `<p class="text-gray-400 text-[13px] mb-3">${d.calendario.descripcion}</p>`;
            html += '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">';
            d.calendario.torneos.forEach(t => {
                html += `<div class="bg-gray-800 border border-gray-700 rounded-lg p-4 text-center">
                    <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">${t.nombre} — Fecha final</p>
                    <p class="text-lg font-bold text-white">${t.fechaFinal}</p>
                    <p class="text-xs text-gray-500 mt-1">${t.fechas}</p></div>`;
            });
            html += '</div>';
            html += `<h3 class="font-semibold text-gray-200 mb-2 text-sm uppercase tracking-wide">🃏 Comodín</h3>`;
            html += `<p class="text-gray-400 text-[13px] mb-2">${d.calendario.comodin.descripcion}</p>`;
            html += '<ul class="space-y-2 text-gray-300 text-[15px] leading-relaxed">';
            d.calendario.comodin.reglas.forEach(r => { html += bullet(r); });
            html += '</ul></section>';

            // === MASTER ===
            html += sectionTitle('master', 'Gran Master — Fin de Año');
            html += `<p class="text-gray-300 text-[15px] mb-2 leading-relaxed">${d.master.descripcion}</p>`;
            html += '<div class="space-y-2 mb-4">';
            d.master.cupos.forEach(c => {
                let cText = c.resaltar ? highlight(c.texto, c.resaltar) : c.texto;
                html += `<div class="flex items-start gap-3 bg-gray-800 border border-gray-700 rounded-lg p-3">
                    <span class="w-7 h-7 rounded-full bg-green-900/50 text-green-400 flex items-center justify-center font-bold text-xs flex-shrink-0">${c.cantidad}</span>
                    <p class="text-[15px] text-gray-300">${cText}</p></div>`;
            });
            html += '</div></section>';

            // === CIEGAS ===
            html += sectionTitle('ciegas', 'Estructura de Ciegas');
            html += '<ul class="space-y-2 text-gray-300 text-[15px] leading-relaxed mb-4">';
            d.ciegas.reglas.forEach(r => { html += bullet(r); });
            html += '</ul>';
            // Tabla
            html += `<div class="overflow-x-auto border border-gray-700 rounded-lg"><table class="w-full text-sm">
                <thead class="bg-gray-950 text-gray-200"><tr>
                    <th class="py-2 px-3 text-left font-medium">Nivel</th>
                    <th class="py-2 px-3 text-center font-medium">Chica</th>
                    <th class="py-2 px-3 text-center font-medium">Grande</th>
                    <th class="py-2 px-3 text-center font-medium">Ante</th>
                    <th class="py-2 px-3 text-right font-medium">Duración</th>
                </tr></thead><tbody class="divide-y divide-gray-800 text-gray-300">`;
            d.ciegas.niveles.forEach((n, i) => {
                const bg = n.destacado ? 'bg-green-900/30 border-l-4 border-green-500' : (i % 2 === 0 ? 'bg-gray-900' : 'bg-gray-800/50');
                const tc = n.destacado ? 'text-green-400 font-semibold' : '';
                const label = n.destacado ? `${n.nivel} ⚡` : n.nivel;
                html += `<tr class="${bg}">
                    <td class="py-2 px-3 font-medium ${n.destacado ? 'text-green-400 font-bold' : 'text-white'}">${label}</td>
                    <td class="py-2 px-3 text-center ${tc}">${n.chica}</td>
                    <td class="py-2 px-3 text-center ${tc}">${n.grande}</td>
                    <td class="py-2 px-3 text-center ${n.ante ? tc : 'text-gray-600'}">${n.ante ?? '—'}</td>
                    <td class="py-2 px-3 text-right text-gray-500">13 min</td></tr>`;
            });
            html += '</tbody></table></div>';
            html += `<p class="text-xs text-gray-500 mt-2 italic">⚡ ${d.ciegas.nota}</p></section>`;

            // === MESA ===
            html += sectionTitle('mesa', 'Reglamento de Mesa');

            html += '<h3 class="font-semibold text-gray-200 mb-2 mt-5">Sentarse a jugar</h3>';
            html += '<ul class="space-y-2 text-gray-300 text-[15px] leading-relaxed">';
            d.mesa.sentarse.forEach(r => { html += bullet(r); });
            html += '</ul>';

            html += '<h3 class="font-semibold text-gray-200 mb-2 mt-5">Reparto de cartas</h3>';
            html += '<ul class="space-y-2 text-gray-300 text-[15px] leading-relaxed">';
            d.mesa.repartir.forEach(r => { html += bullet(r); });
            html += '</ul>';

            html += '<h3 class="font-semibold text-gray-200 mb-2 mt-5">Tiempo de decisión</h3>';
            html += '<ul class="space-y-2 text-gray-300 text-[15px] leading-relaxed">';
            d.mesa.tiempo.forEach(r => { html += bullet(r); });
            html += '</ul></section>';

            // Render
            document.getElementById('content').innerHTML = html;

            // Active nav on scroll
            const sections = document.querySelectorAll('section[id]');
            const navLinks = document.querySelectorAll('.nav-link');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        navLinks.forEach(link => link.classList.remove('active-nav'));
                        const active = document.querySelector(`.nav-link[href="#${entry.target.id}"]`);
                        if (active) active.classList.add('active-nav');
                    }
                });
            }, { rootMargin: '-20% 0px -70% 0px' });
            sections.forEach(section => observer.observe(section));
        });
    </script>
</body>
</html>
